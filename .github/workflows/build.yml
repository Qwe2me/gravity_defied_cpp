name: Build Gravity Defied for Miyoo CFW

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout your forked source
      uses: actions/checkout@v4
    
    - name: Build with Docker
      run: |
        docker run --rm \
          -v $(pwd):/src \
          -w /src \
          miyoocfw/toolchain-shared-uclibc:latest \
          make -f Makefile.miyoo clean all
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gravity-defied-miyoo
        path: |
          gravity.out
          assets/
